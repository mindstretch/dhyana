<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dhyana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1219;
  --text-1: rgba(255,255,255,0.88);
  --text-2: rgba(255,255,255,0.52);
  --text-3: rgba(255,255,255,0.28);
  --restful: #E8A855;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; height: -webkit-fill-available; }

body {
  min-height: 100%;
  min-height: -webkit-fill-available;
  background: var(--bg);
  color: var(--text-1);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
}

.orb-container { touch-action: none; }

.screen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px max(24px, env(safe-area-inset-bottom)) 20px;
  padding-top: max(24px, env(safe-area-inset-top));
  gap: 0;
}
.screen.hidden { display: none; }

.wordmark {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--text-2);
  letter-spacing: 0.02em;
  align-self: center;
  margin-bottom: 20px;
  flex-shrink: 0;
}

.welcome {
  font-size: 12px;
  font-weight: 300;
  color: var(--text-3);
  letter-spacing: 0.02em;
  text-align: center;
  margin-top: -8px;
  margin-bottom: 16px;
  opacity: 0;
  transition: opacity 0.8s ease;
  min-height: 16px;
}
.welcome.visible { opacity: 1; }

/* ── ORB ZONE ─────────────────────────────────────── */
.orb-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  flex: 0 0 auto;
  justify-content: center;
  width: 100%;
}

.prompt {
  font-size: 20px;
  font-weight: 300;
  color: var(--text-1);
  text-align: center;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin-bottom: 28px;
  transition: opacity 0.5s ease;
  flex-shrink: 0;
}
.prompt em { font-style: italic; color: var(--text-2); }

.orb-container {
  position: relative;
  --orb-size: min(260px, 58vw, 44vh);
  width: var(--orb-size);
  height: var(--orb-size);
  flex-shrink: 0;
  user-select: none;
  -webkit-user-select: none;
  overflow: visible;
}

.orb-glow {
  position: absolute;
  inset: -32px;
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(111,168,154,0.08) 0%, transparent 70%);
  filter: blur(20px);
  transition: background 1.4s ease;
  pointer-events: none;
  animation: orb-glow-breathe 6s ease-in-out infinite;
}
@keyframes orb-glow-breathe {
  0%, 100% { opacity: 0.7; transform: scale(1);    }
  50%       { opacity: 1.0; transform: scale(1.06); }
}

.orb {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse 80% 80% at 70% 28%,  rgba(232,168,85,0.85)  0%, transparent 52%),
    radial-gradient(ellipse 72% 72% at 24% 26%,  rgba(201,107,90,0.72)  0%, transparent 52%),
    radial-gradient(ellipse 70% 70% at 22% 76%,  rgba(90,110,138,0.80)  0%, transparent 52%),
    radial-gradient(ellipse 68% 68% at 76% 78%,  rgba(122,104,128,0.68) 0%, transparent 52%),
    radial-gradient(circle at 50% 50%,            rgba(111,168,154,0.55) 0%, transparent 60%),
    radial-gradient(circle at 50% 50%,            #131b26 0%, #0e1219 100%);
  cursor: crosshair;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 20px 56px rgba(0,0,0,0.5);
  animation: orb-breathe 7s ease-in-out infinite;
}
@keyframes orb-breathe {
  0%, 100% { transform: scale(1);     }
  50%       { transform: scale(1.022); }
}

.orb::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse 40% 28% at 62% 22%, rgba(255,255,255,0.09) 0%, transparent 60%),
    radial-gradient(ellipse 22% 18% at 38% 68%, rgba(255,255,255,0.04) 0%, transparent 60%);
  animation: orb-shimmer 9s ease-in-out infinite;
  pointer-events: none;
}
@keyframes orb-shimmer {
  0%   { opacity: 0.6; transform: translateX(0)    translateY(0); }
  30%  { opacity: 1.0; transform: translateX(3px)  translateY(-2px); }
  65%  { opacity: 0.7; transform: translateX(-2px) translateY(3px); }
  100% { opacity: 0.6; transform: translateX(0)    translateY(0); }
}

.orb::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(14,18,25,0.55) 100%);
  pointer-events: none;
}

#rippleCanvas {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  overflow: hidden;
}

.axis-label {
  position: absolute;
  font-size: 9px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.32);
  pointer-events: none;
  white-space: nowrap;
  z-index: 2;
}
.axis-label.top    { top: 13%;  left: 50%; transform: translateX(-50%); }
.axis-label.bottom { bottom: 13%; left: 50%; transform: translateX(-50%); }
.axis-label.left   { left: 8%;  top: 50%;  transform: translateY(-50%); }
.axis-label.right  { right: 8%; top: 50%;  transform: translateY(-50%); }

.indicator {
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(4px);
  transform: translate(-50%, -50%) scale(0.4);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 0 10px rgba(255,255,255,0.25), 0 0 3px rgba(255,255,255,0.5);
}
.indicator.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.state-reveal {
  height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  margin-top: 20px;
}
.state-name {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.01em;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity 0.5s ease, transform 0.5s ease, color 0.5s ease;
}
.state-name.visible { opacity: 1; transform: translateY(0); }
.state-desc {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-2);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
}
.state-desc.visible { opacity: 1; transform: translateY(0); }

.hint {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.04em;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s ease;
  margin-top: 8px;
  flex-shrink: 0;
}
.hint.hidden { opacity: 0; pointer-events: none; }

/* ── CONTINUE CTA (replaces waitlist) ─────────────── */
.cta-zone {
  width: 100%;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
  padding-top: 20px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: none;
}
.cta-zone.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.continue-btn {
  background: transparent;
  color: var(--restful);
  border: 1px solid rgba(232,168,85,0.32);
  border-radius: 100px;
  padding: 13px 26px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.continue-btn:hover  { background: rgba(232,168,85,0.10); }
.continue-btn:active { transform: scale(0.98); }
.continue-btn span { transition: transform 0.2s; }
.continue-btn:hover span { transform: translateX(3px); }

/* ── PROTOCOL SCREEN ──────────────────────────────── */
.screen.s-protocol { justify-content: flex-start; }
.p-wrap {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  margin: auto 0;
  padding: 8px 0 24px;
}
.p-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 22px;
}
.p-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.p-eyebrow {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--restful);
  margin-bottom: 14px;
}
.p-title {
  font-family: 'DM Serif Display', serif;
  font-weight: 400;
  font-size: 27px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--text-1);
  margin-bottom: 14px;
}
.p-body {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.65;
  color: var(--text-2);
  margin-bottom: 24px;
}

.p-science {
  border-left: 2px solid rgba(232,168,85,0.4);
  padding: 2px 0 2px 16px;
  margin-bottom: 22px;
}
.p-science-head { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.p-science-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--restful); }
.p-science-tag { font-size: 10px; letter-spacing: 0.06em; color: var(--text-3); }
.p-science-body { font-size: 13.5px; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.62); }

.p-hints { margin-bottom: 24px; display: flex; flex-direction: column; gap: 7px; }
.p-hint { font-size: 13px; font-weight: 300; line-height: 1.45; color: var(--text-3); padding-left: 14px; position: relative; }
.p-hint::before { content: '—'; position: absolute; left: 0; color: rgba(255,255,255,0.22); }

.p-science-link {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  color: var(--restful);
  text-decoration: none;
  border-bottom: 1px solid rgba(232,168,85,0.3);
  padding-bottom: 1px;
}
.p-science-link:hover { border-bottom-color: rgba(232,168,85,0.7); }

/* ── MEDITATION ─────────────────────────────────── */
.p-med { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 22px; margin-bottom: 24px; }
.p-med-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--restful); margin-bottom: 16px; text-align: center; }
.p-med-idle { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.med-durs { display: flex; align-items: center; gap: 10px; }
.med-dur {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
  color: var(--text-2); font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.med-dur:hover { border-color: rgba(255,255,255,0.22); }
.med-dur.selected { background: rgba(232,168,85,0.14); border-color: rgba(232,168,85,0.42); color: var(--restful); }
.med-unit { font-size: 12px; color: var(--text-3); margin-left: 2px; }
.med-begin {
  background: var(--restful); color: #0E1219; border: none; border-radius: 100px;
  padding: 11px 30px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.med-begin:hover { opacity: 0.9; }
.med-begin:active { transform: scale(0.97); }
.p-med-run { flex-direction: column; align-items: center; gap: 14px; }
.med-timer { font-family: 'DM Serif Display', serif; font-size: 46px; color: var(--text-1); font-variant-numeric: tabular-nums; }
.p-med-done { font-size: 12px; color: var(--text-3); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; }

/* practice card */
.p-practice {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 24px;
  background: rgba(255,255,255,0.02);
}
.practice-idle { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.practice-meta { display: flex; flex-direction: column; gap: 2px; }
.practice-meta > span:first-child { font-size: 15px; color: var(--text-1); }
.practice-dur { font-size: 12px; color: var(--text-3); letter-spacing: 0.02em; }
.practice-btn {
  flex-shrink: 0;
  background: var(--restful);
  color: #0E1219;
  border: none;
  border-radius: 100px;
  padding: 11px 24px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.practice-btn:hover  { opacity: 0.9; }
.practice-btn:active { transform: scale(0.97); }

.practice-run { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 6px 0; }
.practice-run.active { display: flex; }
.timer {
  font-family: 'DM Serif Display', serif;
  font-size: 44px;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
.timer-track { width: 100%; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.timer-fill { height: 100%; width: 0%; background: var(--restful); border-radius: 2px; transition: width 1s linear; }
.timer-end {
  background: transparent;
  border: none;
  color: var(--text-3);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
}
.timer-end:hover { color: var(--text-2); }
.practice-settled { display: none; font-size: 12px; color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; text-align: center; padding: 8px 0; }
.practice-settled.active { display: block; }

/* reflection */
.p-reflect { margin-bottom: 22px; }
.reflect-prompt {
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
  font-style: italic;
  line-height: 1.4;
  color: var(--text-1);
  margin-bottom: 14px;
}
.reflect-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px 16px;
  color: var(--text-1);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 1.5;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
}
.reflect-input::placeholder { color: var(--text-3); }
.reflect-input:focus { border-color: rgba(232,168,85,0.3); }
.reflect-save {
  margin-top: 12px;
  background: transparent;
  color: var(--text-2);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 100px;
  padding: 10px 22px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.reflect-save:hover { color: var(--text-1); border-color: rgba(255,255,255,0.22); }
.reflect-done { display: none; align-items: center; gap: 10px; padding: 4px 0; }
.reflect-done.active { display: flex; }
.reflect-done-mark {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--restful); color: var(--restful);
  display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
}
.reflect-done-text { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 16px; color: var(--text-1); }

/* structured reflection (e.g. three good things) */
.struct-hint { font-size: 12.5px; font-weight: 300; color: var(--text-3); line-height: 1.5; margin-bottom: 14px; }
.struct-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.struct-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--text-1);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 300;
  outline: none;
  transition: border-color 0.2s;
}
.struct-input::placeholder { color: var(--text-3); }
.struct-input:focus { border-color: rgba(232,168,85,0.3); }

.struct-field { display: flex; flex-direction: column; }
.struct-label { font-size: 12px; font-weight: 300; color: var(--text-2); margin-bottom: 9px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 100px;
  padding: 7px 14px;
  color: var(--text-2);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 300;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.tag:hover { border-color: rgba(255,255,255,0.22); }
.tag.selected { background: rgba(232,168,85,0.14); border-color: rgba(232,168,85,0.42); color: var(--restful); }
.slider-wrap { display: flex; align-items: center; gap: 16px; }
.struct-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 2px; background: rgba(255,255,255,0.14); border-radius: 2px; outline: none; }
.struct-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--restful); cursor: pointer; }
.struct-slider::-moz-range-thumb { width: 18px; height: 18px; border: none; border-radius: 50%; background: var(--restful); cursor: pointer; }
.slider-out { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--restful); font-variant-numeric: tabular-nums; min-width: 22px; text-align: center; }

.p-why {
  font-size: 12px;
  font-weight: 300;
  line-height: 1.55;
  color: var(--text-3);
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 16px;
  margin-bottom: 24px;
}

.p-again {
  align-self: center;
  background: transparent;
  border: none;
  color: var(--text-3);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  letter-spacing: 0.04em;
  cursor: pointer;
  padding: 6px 12px;
  transition: color 0.2s;
}
.p-again:hover { color: var(--text-2); }

/* ── VOLUME CONTROL ───────────────────────────────── */
.volume-control {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 100;
  opacity: 0;
  animation: fade-in-volume 1.8s ease 2s forwards;
}
@keyframes fade-in-volume { to { opacity: 1; } }
.volume-icon { width: 16px; height: 16px; color: rgba(255,255,255,0.28); cursor: pointer; transition: color 0.2s ease; flex-shrink: 0; }
.volume-icon:hover { color: rgba(255,255,255,0.55); }
.volume-icon svg { width: 100%; height: 100%; display: block; }
.volume-slider-wrap { width: 64px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; position: relative; cursor: pointer; }
.volume-slider-fill { height: 100%; background: rgba(255,255,255,0.22); border-radius: 2px; width: 0%; pointer-events: none; transition: background 0.2s ease; }
.volume-slider-wrap:hover .volume-slider-fill { background: rgba(232,168,85,0.5); }
.volume-thumb { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%) scale(0); width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.72); pointer-events: none; transition: transform 0.2s ease, background 0.2s ease; }
.volume-slider-wrap:hover .volume-thumb { transform: translate(-50%, -50%) scale(1); background: var(--restful); }
</style>
</head>
<body>

<!-- ══ SCREEN 1: CHECK-IN ══ -->
<div class="screen s-checkin" id="screenCheckin">
  <div class="wordmark">Dhyana</div>
  <div class="welcome" id="welcome"></div>

  <div class="orb-zone">
    <p class="prompt" id="prompt">Where are you<br><em>right now?</em></p>

    <div class="orb-container" id="orbContainer">
      <div class="orb-glow" id="orbGlow"></div>
      <div class="orb" id="orb">
        <canvas id="rippleCanvas"></canvas>
      </div>
      <div class="indicator" id="indicator"></div>
      <span class="axis-label top">energized</span>
      <span class="axis-label bottom">depleted</span>
      <span class="axis-label left">stressed</span>
      <span class="axis-label right">regulated</span>
    </div>

    <div class="hint" id="hint">touch to place yourself</div>
    <div class="state-reveal" id="stateReveal" style="display:none;">
      <div class="state-name" id="stateName"></div>
      <div class="state-desc" id="stateDesc"></div>
    </div>
  </div>

  <div class="cta-zone" id="ctaZone">
    <button class="continue-btn" id="continueBtn">Today's practice <span>→</span></button>
  </div>
</div>

function currentProgramDay() {
  const q = new URLSearchParams(location.search).get('day');
  if (q) return Math.min(PROGRAM.length, Math.max(1, parseInt(q, 10) || 1));
  let start = null;
  try { start = localStorage.getItem('dhyana_program_start'); } catch(e) {}
  if (!start) {
    start = new Date().toISOString().slice(0, 10);
    try { localStorage.setItem('dhyana_program_start', start); } catch(e) {}
  }
  const days = Math.floor((Date.now() - new Date(start + 'T00:00:00').getTime()) / 86400000);
  return Math.min(PROGRAM.length, Math.max(1, days + 1));
}

function classify(nx, ny) {
  const d = Math.sqrt(nx*nx + ny*ny);
  if (d < 0.28) return 'regulated';
  if (ny >  0.15 && nx >  0.1)  return 'restful';
  if (ny >  0.15 && nx < -0.1)  return 'activated';
  if (ny < -0.15 && nx <  0)    return 'depleted';
  if (ny < -0.15 && nx >  0)    return 'dysreg';
  if (nx >  0.5  && Math.abs(ny) < 0.3) return 'regulated';
  if (nx < -0.5  && Math.abs(ny) < 0.3) return 'activated';
  return 'regulated';
}

/* ── CANVAS RIPPLE ENGINE ── */
const canvas  = document.getElementById('rippleCanvas');
const ctx     = canvas.getContext('2d');
let ripples   = [];
let rafId     = null;

function resizeCanvas() {
  const orb = document.getElementById('orb');
  const r   = orb.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
}
function spawnRipple(px, py, color) {
  const r = canvas.getBoundingClientRect();
  ripples.push({ x: px * r.width, y: py * r.height, born: performance.now(), color });
}
function drawRipples(now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const orbR = canvas.width / 2;
  const maxR = orbR * 1.0;
  const dur  = 1400;
  ripples = ripples.filter(rip => {
    const t = now - rip.born;
    if (t > dur) return false;
    const prog = t / dur;
    for (let i = 0; i < 3; i++) {
      const delay = i * 0.18;
      const p = Math.max(0, prog - delay);
      if (p <= 0) continue;
      const radius = p * maxR;
      const alpha  = Math.max(0, (1 - p) * (1 - delay) * 0.45);
      ctx.beginPath();
      ctx.arc(rip.x, rip.y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = rip.color ? hexToRgba(rip.color, alpha) : `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 1.2 - i * 0.25;
      ctx.stroke();
    }
    return true;
  });
  if (ripples.length > 0) rafId = requestAnimationFrame(t => drawRipples(t));
  else { rafId = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ── INTERACTION ── */
const orbEl     = document.getElementById('orb');
const orbGlow   = document.getElementById('orbGlow');
const indicator = document.getElementById('indicator');
const stateName = document.getElementById('stateName');
const stateDesc = document.getElementById('stateDesc');
const hint      = document.getElementById('hint');
const stateReveal = document.getElementById('stateReveal');
const ctaZone   = document.getElementById('ctaZone');

let placed       = false;
let currentState = null;

function getCenter() {
  const r = orbEl.getBoundingClientRect();
  return { cx: r.left + r.width/2, cy: r.top + r.height/2, radius: r.width/2 };
}
function onPlace(clientX, clientY) {
  const { cx, cy, radius } = getCenter();
  const dx = clientX - cx, dy = clientY - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  let x = clientX, y = clientY;
  if (dist > radius) { x = cx + (dx / dist) * radius; y = cy + (dy / dist) * radius; }
  const r  = orbEl.getBoundingClientRect();
  const px = (x - r.left) / r.width;
  const py = (y - r.top)  / r.height;
  const nx = (px - 0.5) * 2;
  const ny = -(py - 0.5) * 2;

  const key = classify(nx, ny);
  currentState = key;
  const state = STATES[key];

  indicator.style.left = `${px * 100}%`;
  indicator.style.top  = `${py * 100}%`;
  indicator.classList.add('visible');

  resizeCanvas();
  spawnRipple(px, py, state.color);
  if (!rafId) rafId = requestAnimationFrame(t => drawRipples(t));

  orbGlow.style.background = `radial-gradient(circle at center, ${state.glow} 0%, transparent 70%)`;
  stateName.style.color = state.color;
  stateName.textContent = state.name;
  stateDesc.textContent = state.desc;

  if (!placed) {
    placed = true;
    hint.classList.add('hidden');
    setTimeout(() => {
      hint.style.display = 'none';
      stateReveal.style.display = 'flex';
      setTimeout(() => { stateName.classList.add('visible'); stateDesc.classList.add('visible'); }, 40);
    }, 400);
    setTimeout(() => { ctaZone.classList.add('visible'); }, 700);
  } else {
    stateName.classList.remove('visible');
    stateDesc.classList.remove('visible');
    requestAnimationFrame(() => setTimeout(() => {
      stateName.classList.add('visible');
      stateDesc.classList.add('visible');
    }, 40));
  }
}

orbEl.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; onPlace(t.clientX,t.clientY); }, {passive:false});
orbEl.addEventListener('touchmove',  e => { e.preventDefault(); const t=e.touches[0]; onPlace(t.clientX,t.clientY); }, {passive:false});
let md = false;
orbEl.addEventListener('mousedown', e => { md=true; onPlace(e.clientX,e.clientY); });

function relTime(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24)  return hrs === 1 ? 'an hour ago' : hrs + ' hours ago';
  const days = Math.round(hrs / 24);
  if (days === 1) return 'yesterday';
  if (days < 7)   return days + ' days ago';
  const wks = Math.round(days / 7);
  return wks === 1 ? 'last week' : wks + ' weeks ago';
}

  if (!day) return;
  const s = STATES[currentState];

  document.getElementById('pDot').style.background = s ? s.color : 'var(--restful)';
  document.getElementById('pState').textContent = 'Day ' + dayNum + (s ? ' · ' + s.name.toLowerCase() : '');
  document.getElementById('pEyebrow').textContent = day.category || '';
  document.getElementById('pTitle').textContent = day.intention || '';

  const bodyEl = document.getElementById('pBody');
  if (day.framing) { bodyEl.textContent = day.framing; bodyEl.style.display = ''; }
  else { bodyEl.style.display = 'none'; }

  const sci = document.getElementById('pScience');
  if (day.science) {
    document.getElementById('pScienceBody').textContent = day.science;
    document.getElementById('pScienceTag').textContent = day.scienceTag || '';
    const link = document.getElementById('pScienceLink');
    if (day.source && day.source.url) {
      link.textContent = '→ ' + (day.source.title || 'read the research');
      link.href = day.source.url;
      link.style.display = 'inline-block';
    } else { link.style.display = 'none'; }
    sci.style.display = 'block';
  } else { sci.style.display = 'none'; }

  document.getElementById('pMeditation').style.display = 'none';

  const hintsEl = document.getElementById('pHints');
  hintsEl.innerHTML = '';
  if (day.hints && day.hints.length) {
    for (const h of day.hints) {
      const el = document.createElement('div');
      el.className = 'p-hint';
      el.textContent = h;
      hintsEl.appendChild(el);
    }
    hintsEl.style.display = 'flex';
  } else { hintsEl.style.display = 'none'; }

  // program days have no timer; reflection is the practice
  document.getElementById('pPractice').style.display = 'none';
  document.getElementById('pWhy').style.display = 'none';
  resetPractice();

  document.getElementById('reflectFree').style.display = 'none';
  document.getElementById('reflectStructured').style.display = 'block';
  buildStructured({ template: day.template, done: day.done, key: day.key });

  saveCheckin(currentState, dayNum);

  screenCheckin.classList.add('hidden');
  screenProtocol.classList.remove('hidden');
  window.scrollTo(0, 0);
}

/* practice timer */
let timerInt = null;
const PRACTICE_SECONDS = 300;

function fmt(s) {
  const m = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2, '0');
  return `${m}:${ss}`;
}
function resetPractice() {
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  document.getElementById('practiceIdle').style.display = 'flex';
  document.getElementById('practiceRun').classList.remove('active');
  document.getElementById('practiceSettled').classList.remove('active');
  document.getElementById('timer').textContent = fmt(PRACTICE_SECONDS);
  document.getElementById('timerFill').style.width = '0%';
}
function beginPractice() {
  document.getElementById('practiceIdle').style.display = 'none';
  document.getElementById('practiceRun').classList.add('active');
  let remaining = PRACTICE_SECONDS;
  document.getElementById('timer').textContent = fmt(remaining);
  timerInt = setInterval(() => {
    remaining -= 1;
    document.getElementById('timer').textContent = fmt(Math.max(0, remaining));
    const pct = ((PRACTICE_SECONDS - remaining) / PRACTICE_SECONDS) * 100;
    document.getElementById('timerFill').style.width = Math.min(100, pct) + '%';
    if (remaining <= 0) endPractice();
  }, 1000);
}
function endPractice() {
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  document.getElementById('practiceRun').classList.remove('active');
  document.getElementById('practiceSettled').classList.add('active');
  document.getElementById('reflectInput').focus();
}
document.getElementById('beginBtn').addEventListener('click', beginPractice);
document.getElementById('endBtn').addEventListener('click', endPractice);

/* reflection save — local acknowledgment for now (storage is a later step) */
document.getElementById('saveBtn').addEventListener('click', () => {
  const text = document.getElementById('reflectInput').value.trim();
  saveReflection(text);
  document.getElementById('reflectInput').style.display = 'none';
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('reflectDone').classList.add('active');
});

/* structured reflection (three good things, etc.) */
let currentStructured = null;

function renderField(wrap, f) {
  const c = document.createElement('div');
  c.className = 'struct-field';
  c.setAttribute('data-field', f.name);
  if (f.label) {
    const lab = document.createElement('div');
    lab.className = 'struct-label';
    lab.textContent = f.label;
    c.appendChild(lab);
  }
  const type = f.type || 'text';
  if (type === 'tags') {
    const row = document.createElement('div');
    row.className = 'tag-row';
    for (const opt of (f.options || [])) {
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'tag';
      t.setAttribute('data-tag', opt);
      t.textContent = opt;
      t.addEventListener('click', () => t.classList.toggle('selected'));
      row.appendChild(t);
    }
    c.appendChild(row);
  } else if (type === 'slider') {
    const min = f.min || 1, max = f.max || 9;
    const sw = document.createElement('div');
    sw.className = 'slider-wrap';
    const range = document.createElement('input');
    range.type = 'range'; range.min = min; range.max = max; range.step = 1;
    range.value = f.default != null ? f.default : Math.round((min + max) / 2);
    range.className = 'struct-slider';
    const out = document.createElement('span');
    out.className = 'slider-out';
    out.textContent = range.value;
    range.addEventListener('input', () => { out.textContent = range.value; });
    sw.appendChild(range);
    sw.appendChild(out);
    c.appendChild(sw);
  } else {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'struct-input';
    inp.placeholder = f.placeholder || '';
    inp.maxLength = 200;
    c.appendChild(inp);
  }
  wrap.appendChild(c);
}

function buildStructured(cfg) {
  const promptEl = document.getElementById('structPrompt');
  promptEl.textContent = cfg.prompt || '';
  promptEl.style.display = cfg.prompt ? '' : 'none';
  const hintEl = document.getElementById('structHint');
  if (cfg.hint) { hintEl.textContent = cfg.hint; hintEl.style.display = 'block'; }
  else { hintEl.style.display = 'none'; }
  const wrap = document.getElementById('structFields');
  wrap.innerHTML = '';
  const base = cfg.template || Array.from({ length: cfg.fields || 3 }, () => ({ type: 'text', placeholder: cfg.placeholder || '' }));
  const fields = base.map((f, i) => ({ ...f, name: f.name || ('field_' + (i + 1)) }));
  fields.forEach(f => renderField(wrap, f));
  currentStructured = { key: cfg.key || 'structured', fields };
  wrap.style.display = 'flex';
  document.getElementById('structSaveBtn').style.display = '';
  document.getElementById('structDone').classList.remove('active');
  document.getElementById('structDoneText').textContent = cfg.done || 'Saved.';
}

async function saveStructured(data, text) {
  if (!currentCheckinId) return;
  try {
    await fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentCheckinId, reflection: text, reflection_data: data })
    });
  } catch(e) { /* fail quietly */ }
}

document.getElementById('structSaveBtn').addEventListener('click', () => {
  if (!currentStructured) return;
  const data = {};
  const parts = [];
  for (const f of currentStructured.fields) {
    const c = document.querySelector('#structFields [data-field="' + f.name + '"]');
    if (!c) continue;
    const type = f.type || 'text';
    if (type === 'tags') {
      const sel = [...c.querySelectorAll('.tag.selected')].map(t => t.getAttribute('data-tag'));
      data[f.name] = sel;
      if (sel.length) parts.push(sel.join(', '));
    } else if (type === 'slider') {
      const r = c.querySelector('input[type="range"]');
      const v = r ? Number(r.value) : null;
      data[f.name] = v;
      if (v != null) parts.push(v + '/' + (f.max || 9));
    } else {
      const inp = c.querySelector('input[type="text"]');
      const v = inp ? inp.value.trim() : '';
      data[f.name] = v;
      if (v) parts.push(v);
    }
  }
  saveStructured({ key: currentStructured.key, fields: data }, parts.join(' · '));
  document.getElementById('structFields').style.display = 'none';
  document.getElementById('structHint').style.display = 'none';
  document.getElementById('structSaveBtn').style.display = 'none';
  document.getElementById('structDone').classList.add('active');
  revealMeditation();
});

/* ── MEDITATION (closing sit) ── */
let medMin = 10, medInt = null, medRemaining = 0, medTotal = 0;

function selectMedDur(min) {
  medMin = min;
  document.querySelectorAll('#medDurs .med-dur').forEach(b =>
    b.classList.toggle('selected', Number(b.dataset.min) === min));
  document.getElementById('medTimer').textContent = fmt(min * 60);
}
document.querySelectorAll('#medDurs .med-dur').forEach(b =>
  b.addEventListener('click', () => selectMedDur(Number(b.dataset.min))));

function revealMeditation() {
  document.getElementById('pMeditation').style.display = 'block';
  document.getElementById('medIdle').style.display = 'flex';
  document.getElementById('medRun').style.display = 'none';
  document.getElementById('medDone').style.display = 'none';
  selectMedDur(medMin);
}

function beginMed() {
  document.getElementById('medIdle').style.display = 'none';
  document.getElementById('medRun').style.display = 'flex';
  medTotal = medMin * 60;
  medRemaining = medTotal;
  document.getElementById('medTimer').textContent = fmt(medRemaining);
  document.getElementById('medFill').style.width = '0%';
  medInt = setInterval(() => {
    medRemaining -= 1;
    document.getElementById('medTimer').textContent = fmt(Math.max(0, medRemaining));
    document.getElementById('medFill').style.width =
      Math.min(100, ((medTotal - medRemaining) / medTotal) * 100) + '%';
    if (medRemaining <= 0) endMed();
  }, 1000);
}

function endMed() {
  if (medInt) { clearInterval(medInt); medInt = null; }
  const elapsed = medTotal - Math.max(0, medRemaining);
  document.getElementById('medRun').style.display = 'none';
  document.getElementById('medDone').style.display = 'block';
  saveMeditation(elapsed);
}

async function saveMeditation(seconds) {
  if (!currentCheckinId || !seconds) return;
  try {
    await fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentCheckinId, meditation_seconds: seconds })
    });
  } catch(e) { /* fail quietly */ }
}

document.getElementById('medBegin').addEventListener('click', beginMed);
document.getElementById('medEnd').addEventListener('click', endMed);

document.getElementById('againBtn').addEventListener('click', () => location.reload());

/* ── AUDIO + VOLUME ── */
const audio       = document.getElementById('bgAudio');
const volumeWrap  = document.getElementById('volumeSliderWrap');
const volumeFill  = document.getElementById('volumeFill');
const volumeThumb = document.getElementById('volumeThumb');
const iconMuted   = document.getElementById('iconMuted');
const iconUnmuted = document.getElementById('iconUnmuted');
const volumeIcon  = document.getElementById('volumeIcon');

let isMuted = false;
let volume  = 0.10;
audio.volume = 0.10;
audio.muted  = false;

function setVolume(v) {
  volume = Math.max(0, Math.min(1, v));
  audio.volume = volume;
  const pct = volume * 100;
  volumeFill.style.width = pct + '%';
  volumeThumb.style.left = pct + '%';
  if (volume === 0) mute();
  else if (isMuted) unmute();
}
function unmute() {
  isMuted = false; audio.muted = false; audio.volume = volume;
  iconMuted.style.display = 'none'; iconUnmuted.style.display = 'block';
  audio.play().catch(() => {});
}
function mute() {
  isMuted = true; audio.muted = true;
  iconMuted.style.display = 'block'; iconUnmuted.style.display = 'none';
}
volumeIcon.addEventListener('click', () => {
  if (isMuted) { if (volume === 0) volume = 0.45; setVolume(volume); unmute(); }
  else mute();
});
let dragging = false;
function getVolumeFromEvent(e) {
  const rect = volumeWrap.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return Math.max(0, Math.min(1, x / rect.width));
}
volumeWrap.addEventListener('mousedown',  e => { dragging = true; setVolume(getVolumeFromEvent(e)); });
volumeWrap.addEventListener('touchstart', e => { dragging = true; setVolume(getVolumeFromEvent(e)); }, { passive: true });
window.addEventListener('mousemove',  e => { if (dragging) setVolume(getVolumeFromEvent(e)); });
window.addEventListener('touchmove',  e => { if (dragging) setVolume(getVolumeFromEvent(e)); }, { passive: true });
window.addEventListener('mouseup',  () => { dragging = false; });
window.addEventListener('touchend', () => { dragging = false; });

setVolume(0.10);
isMuted = true; audio.muted = true;
iconMuted.style.display = 'block'; iconUnmuted.style.display = 'none';

let autoplayUnlocked = false;
function unlockAutoplay() {
  if (autoplayUnlocked) return;
  autoplayUnlocked = true;
  isMuted = false; audio.muted = false; audio.volume = volume;
  iconMuted.style.display = 'none'; iconUnmuted.style.display = 'block';
  audio.play().catch(() => {});
  document.removeEventListener('click', unlockAutoplay);
  document.removeEventListener('touchstart', unlockAutoplay);
}
document.addEventListener('click',      unlockAutoplay, { once: true });
document.addEventListener('touchstart', unlockAutoplay, { once: true });
</script>
